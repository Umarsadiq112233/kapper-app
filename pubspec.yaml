name: kapper
description: Kapper salon booking frontend with customer and vendor experiences.
publish_to: none
version: 1.0.0+6 #IOS VERSION
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: KapperSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

